[project]
name = "fuchsia-rust-sdk"
version = "0.0.0"
description = "Scripts for the out-of-tree Fuchsia Rust driver overlay"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "reuse>=6.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
