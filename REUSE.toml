version = 1

# Generated files whose formats cannot carry a comment header.
[[annotations]]
path = ["overlay.lock.json", "uv.lock", "MODULE.bazel.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Bazel reads this file whole; it cannot carry a comment.
[[annotations]]
path = [".bazelversion"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Copied unchanged from fuchsia.git build/bazel/vendor_patches/rules_rust-0.69.0/ at the
# lock's fuchsia_revision (C4). The added lines are Fuchsia's (BSD-2-Clause, Fuchsia's
# LICENSE is LICENSES/BSD-2-Clause.txt); the context lines are rules_rust's (Apache-2.0).
[[annotations]]
path = ["patches/rules_rust/*.patch"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Fuchsia Authors", "2018 The Bazel Authors"]
SPDX-License-Identifier = "Apache-2.0 AND BSD-2-Clause"

# Fuchsia's patent grant, copied unchanged from fuchsia-cloud-dev (as fuchsia.git ships it),
# for the code scripts/emu.py ports from there (C4).
[[annotations]]
path = ["third_party/fuchsia/PATENTS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Test inputs and golden outputs for the API-level cfgs (tests/api_level, M4), from
# fuchsia.git at the lock's fuchsia_revision (C4): testdata/ holds the release IDK's
# version_history.json and the source tree's sdk/version_history.json, unchanged;
# golden/ is the output of upstream's own build/bazel/versioning/rustc_api_level.bzl
# run unmodified on the latter (recipe in docs/evidence/M4.md). JSON and the golden
# format cannot carry a comment.
[[annotations]]
path = ["tests/api_level/testdata/*.json", "tests/api_level/golden/*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Copied from fuchsia.git at the lock's fuchsia_revision by scripts/regen.py (design R6,
# D6, C4): every file under vendor/fuchsia/ keeps its upstream bytes and header, and
# fuchsia.git's root LICENSE (BSD-2-Clause, the same text as LICENSES/BSD-2-Clause.txt)
# and PATENTS are copied to vendor/fuchsia/, where they cover the tree as they cover
# upstream. Rewritten BUILD.bazel files keep upstream's header below regen.py's;
# vendor/fuchsia/BUILD.bazel is upstream's license target (build/bazel/toplevel.BUILD.bazel).
[[annotations]]
path = ["vendor/fuchsia/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Generated by scripts/regen.py (design R4 subset, milestone M5): each BUILD.<crate>.bazel
# is fuchsia.git's crate_universe-generated third_party/rust_crates/vendor/<crate>/BUILD.bazel
# with labels rewritten (BSD-2-Clause, the Fuchsia Authors); JSON cannot carry a comment.
[[annotations]]
path = ["third_party/crates/BUILD.*.bazel"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["third_party/crates/crates.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Closure reports written by scripts/closure.py (design R12, D8; milestone M6): facts
# measured from fuchsia.git at the lock's revision; JSON cannot carry a comment.
[[annotations]]
path = ["docs/closure/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"
