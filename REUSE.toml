version = 1

# Generated files whose formats cannot carry a comment header.
[[annotations]]
path = ["overlay.lock.json", "uv.lock", "MODULE.bazel.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Bazel reads this file whole; it cannot carry a comment.
[[annotations]]
path = [".bazelversion"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Copied unchanged from fuchsia.git build/bazel/vendor_patches/rules_rust-0.69.0/ at the
# lock's fuchsia_revision (C4). The added lines are Fuchsia's (BSD-2-Clause, Fuchsia's
# LICENSE is LICENSES/BSD-2-Clause.txt); the context lines are rules_rust's (Apache-2.0).
[[annotations]]
path = ["patches/rules_rust/*.patch"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Fuchsia Authors", "2018 The Bazel Authors"]
SPDX-License-Identifier = "Apache-2.0 AND BSD-2-Clause"

# Fuchsia's patent grant, copied unchanged from fuchsia-cloud-dev (as fuchsia.git ships it),
# for the code scripts/emu.py ports from there (C4).
[[annotations]]
path = ["third_party/fuchsia/PATENTS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Test inputs and golden outputs for the API-level cfgs (tests/api_level, M4), from
# fuchsia.git at the lock's fuchsia_revision (C4): testdata/ holds the release IDK's
# version_history.json and the source tree's sdk/version_history.json, unchanged;
# golden/ is the output of upstream's own build/bazel/versioning/rustc_api_level.bzl
# run unmodified on the latter (recipe in docs/evidence/M4.md). JSON and the golden
# format cannot carry a comment.
[[annotations]]
path = ["tests/api_level/testdata/*.json", "tests/api_level/golden/*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Copied from fuchsia.git at the lock's fuchsia_revision by scripts/regen.py (design R6,
# D6, C4): every file under vendor/fuchsia/ keeps its upstream bytes and header, and
# fuchsia.git's root LICENSE (BSD-2-Clause, the same text as LICENSES/BSD-2-Clause.txt)
# and PATENTS are copied to vendor/fuchsia/, where they cover the tree as they cover
# upstream. Rewritten BUILD.bazel files keep upstream's header below regen.py's;
# vendor/fuchsia/BUILD.bazel is upstream's license target (build/bazel/toplevel.BUILD.bazel).
[[annotations]]
path = ["vendor/fuchsia/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Generated by scripts/regen.py (design R4 subset, milestone M5): each BUILD.<crate>.bazel
# is fuchsia.git's crate_universe-generated third_party/rust_crates/vendor/<crate>/BUILD.bazel
# with labels rewritten (BSD-2-Clause, the Fuchsia Authors); JSON cannot carry a comment.
[[annotations]]
path = ["third_party/crates/BUILD.*.bazel"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["third_party/crates/crates.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Closure reports written by scripts/closure.py (design R12, D8; milestone M6): facts
# measured from fuchsia.git at the lock's revision; JSON cannot carry a comment.
[[annotations]]
path = ["docs/closure/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"

# Unchanged copies of fuchsia.git BUILD.gn files at the lock's fuchsia_revision
# (src/storage/lib/vfs/rust, src/storage/lib/trace), test inputs for scripts/gn_eval.py
# (M6a review finding 1). Fuchsia's LICENSE is LICENSES/BSD-2-Clause.txt (C4).
[[annotations]]
path = ["tests/testdata/gn/*.BUILD.gn"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Patched crates.io crates copied from fuchsia.git third_party/rust_crates/<kind>/<dir>/ at
# the lock's fuchsia_revision by scripts/regen.py (design R4, D6, C4; milestone M6b), byte
# for byte except their BUILD.bazel (third_party/crates/BUILD.<kind>.<dir>.bazel, covered
# above). Each keeps its own license files (LICENSE-*, COPYING, UNLICENSE); the license
# expression and copyright are the crate's own (Cargo.toml `license`, LICENSE-MIT).
# README.fuchsia/OWNERS are Fuchsia's metadata files beside them.
[[annotations]]
path = ["third_party/crates/src/forks/libc-0.2.189/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Rust Project Developers"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Fuchsia's fork keeps only signatures and trait definitions (README.fuchsia).
[[annotations]]
path = ["third_party/crates/src/forks/zeroize/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2018-2021 The RustCrypto Project Developers", "The Fuchsia Authors"]
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = ["third_party/crates/src/ask2patch/byteorder/**", "third_party/crates/src/ask2patch/memchr/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 Andrew Gallant"
SPDX-License-Identifier = "Unlicense OR MIT"

# Fuchsia's own files inside the patched crates (the last matching annotation wins, so
# these are not attributed to the crates' authors): its third-party metadata
# (README.fuchsia, OWNERS) and the files Fuchsia's zeroize fork adds, which carry
# Fuchsia's BSD-style header ("found in the LICENSE file": LICENSES/BSD-2-Clause.txt).
[[annotations]]
path = [
    "third_party/crates/src/**/README.fuchsia",
    "third_party/crates/src/**/OWNERS",
    "third_party/crates/src/forks/zeroize/src/barrier.rs",
    "third_party/crates/src/forks/zeroize/src/stack.rs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Test inputs and golden outputs for the FIDL generators (tests/fidlgen, milestone M7),
# copied unchanged from fuchsia.git at the lock's fuchsia_revision (C4): fidlc's IR
# goldens (tools/fidl/fidlc/goldens/<n>.json.golden) and fidlgen_rust_next's goldens
# (tools/fidl/fidlgen_rust_next/goldens/<n>[_common].rs.golden). Recipe and blob IDs in
# docs/evidence/M7.md. Fuchsia's LICENSE is LICENSES/BSD-2-Clause.txt.
[[annotations]]
path = ["tests/fidlgen/testdata/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Pilot 1 (milestone M10): copied unchanged from fuchsia.git
# examples/drivers/simple/rust/ at the lock's fuchsia_revision (src/lib.rs, and
# meta/simple_rust_driver.cml, dmlc's checked-in output). They keep upstream's header;
# Fuchsia's LICENSE is LICENSES/BSD-2-Clause.txt. Blob IDs in docs/evidence/M10.md.
[[annotations]]
path = ["drivers/simple_rust/src/lib.rs", "drivers/simple_rust/meta/simple_rust_driver.cml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Fuchsia Authors"
SPDX-License-Identifier = "BSD-2-Clause"

# Pilot 1's bind rule test spec (investigation I3): `bindc test` reads JSON, which cannot
# carry a comment. The device properties are from the lock's core.x64 (ffx driver
# composite show 00_06_0).
[[annotations]]
path = ["drivers/simple_rust/meta/simple_rust_bind_test.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Curtis Galloway"
SPDX-License-Identifier = "Apache-2.0"
